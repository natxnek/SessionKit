[package]
name = "natxnek/sessionkit"
description = "Simple ProfileStore wrapper to make replicating data easier"
version = "0.1.5"
license = "MIT"
authors = ["Natt <natt@natt.cloud>"]
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
homepage = "https://github.com/natxnek/SessionKit"
repository = "https://github.com/natxnek/SessionKit"

exclude = ["**"]
include = ["src", "src/*", "default.project.json", "wally.lock", "wally.toml", "LICENSE"]

[dependencies]
bytenet = "elitriare/bytenet-max@0.2.7"
Signal = "sleitnick/signal@2.0.0"

[server-dependencies]
ProfileStore = "lm-loleris/profilestore@1.0.3"